name = "tempmail"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# Static assets (frontend UI)
[assets]
directory = "./public"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "tempmail-db"
database_id = "ebfc01aa-9376-491d-b556-907321fda72e"

# Environment variables
[vars]
API_KEY = ""  # Set via: wrangler secret put API_KEY

# Email routing - add your domains here
# After deploy, go to CF Dashboard → Email → Email Routing → Route to Worker
